; gate-01: 1 servo SG90 cần chắn (giữa = đóng, trái = VÀO, phải = RA) + OLED tuỳ chọn.
; Nạp ESP32-S3: pio run -t upload && pio device monitor
; Board ESP32 thường (esp32dev): pio run -e gate-01-esp32 -t upload
[platformio]
default_envs = gate-01

[common]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = -I../common -DCORE_DEBUG_LEVEL=1
lib_deps =
  256dpi/MQTT@^2.5.2
  bblanchon/ArduinoJson@^7.2.0
  madhephaestus/ESP32Servo@^3.0.5
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11

; ESP32-S3 DevKit (N4/N8/N16, có hoặc không PSRAM). Khai báo flash 4 MB để chạy được trên mọi bản.
; Serial log đi qua cổng USB native (cổng "USB"); cắm cổng "COM/UART" thì đổi CDC_ON_BOOT=0.
[env:gate-01]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Reset qua RTS trên USB native đôi khi để chip kẹt ở chế độ nạp; watchdog reset khởi động thẳng vào firmware.
board_upload.after_reset = watchdog_reset
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${common.lib_deps}

[env:gate-01-esp32]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
