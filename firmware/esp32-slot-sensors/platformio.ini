; ESP32 slots-01: 18 nút bấm nối thẳng GPIO (sơ đồ chân ở đầu src/main.cpp). Nạp: pio run -t upload && pio device monitor
[env:slots-01]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = -I../common -DCORE_DEBUG_LEVEL=1
lib_deps =
  256dpi/MQTT@^2.5.2
  bblanchon/ArduinoJson@^7.2.0
