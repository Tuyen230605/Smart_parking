; ESP32 slots-01: VL53L0X ở F1-A1 + 17 nút qua 2 MCP23017. Nạp: pio run -t upload && pio device monitor
[env:slots-01]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = -I../common -DCORE_DEBUG_LEVEL=1
lib_deps =
  256dpi/MQTT@^2.5.2
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
  pololu/VL53L0X@^1.3.1
