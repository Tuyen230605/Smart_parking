[project]
name = "smart-parking-backend"
version = "0.1.0"
description = "Lambda nghiệp vụ Smart Parking: IoT ingest và HTTP API"
requires-python = ">=3.12"
# Runtime Lambda python3.12 có sẵn boto3, nên gói deploy không cần thư viện ngoài.
dependencies = []

[dependency-groups]
dev = [
  "boto3>=1.35",
  "moto[dynamodb]>=5.0",
  "paho-mqtt>=2.0",
  "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "local"]
