# Cấu hình pi-01. Tọa độ ROI theo tỉ lệ khung hình: [x, y, rộng, cao] trong khoảng 0–1.
# Dùng trang preview (http://<ip-pi>:8000) để click lấy tọa độ khi chỉnh khung làn.

[device]
site_id = "site-01"
device_id = "pi-01"
firmware_version = "0.1.0"

[camera]
# "picamera2" trên Pi; số webcam ("0"); hoặc đường dẫn ảnh/video fixture.
source = "picamera2"
camera_num = 0               # cổng CSI: 0 hoặc 1 (Pi 5 có hai cổng). Lắp camera thứ hai cho bãi xe thì đặt 1
# Camera Module 3 (12 MP, lấy nét tự động): 2304x1296. Camera v1.3/OV5647 (5 MP, nét cố định): 1920x1080.
width = 1920
height = 1080
fps = 10

[mqtt]
enabled = true
# Mosquitto local khi phát triển. AWS IoT Core: host = "<prefix>-ats.iot.<region>.amazonaws.com",
# port = 8883, tls = true và trỏ ba file cert nằm NGOÀI repo.
host = "localhost"
port = 1883
tls = false
ca_cert = "/etc/parking/certs/AmazonRootCA1.pem"
cert = "/etc/parking/certs/pi-01.cert.pem"
key = "/etc/parking/certs/pi-01.private.key"
status_interval_s = 30

[presence]
# Phát hiện tay/xe mô hình trong khung làn bằng cách so với ảnh nền trống (presence.py).
diff_threshold = 30          # độ lệch xám 0–255 để coi một điểm ảnh là "khác nền"
min_ratio = 0.08             # ≥ 8% diện tích khung khác nền → có vật. Tay nhỏ trong khung lớn thì giảm xuống
stable_frames = 3            # số frame liên tiếp thấy vật trước khi báo (chống nhiễu)
clear_frames = 8             # số frame liên tiếp trống để nhận lượt mới
cooldown_s = 3.0             # tối thiểu giữa hai lượt cùng làn
absorb_after_s = 15.0        # vật nằm yên lâu hơn → nhập vào nền, làn không bị kẹt

[lanes.ENTRY]
roi = [0.0, 0.0, 0.5, 1.0]   # nửa trái khung hình = làn VÀO

[lanes.EXIT]
roi = [0.5, 0.0, 0.5, 1.0]   # nửa phải khung hình = làn RA

[preview]
enabled = true
port = 8000
width = 960
