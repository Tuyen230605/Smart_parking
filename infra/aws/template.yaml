AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Smart Parking backend: DynamoDB, Lambda IoT ingest + HTTP API, IoT Rule, Cognito và IoT policy
  cho pi-01, gate-01, slots-01 (docs/aws-deployment.md). Certificate thiết bị tạo bằng CLI, không qua stack.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9-]+"
  SiteId:
    Type: String
    Default: site-01
  WebBaseUrl:
    Type: String
    Default: ""
    Description: URL gốc web app cho link QR /s/{token}, không có dấu / cuối. Bỏ trống để dùng domain CloudFront của stack.
  # String thay vì CommaDelimitedList: SAM thay giá trị tham số vào CorsConfiguration dưới dạng chuỗi.
  CorsOrigins:
    Type: String
    Default: http://localhost:5173
    AllowedPattern: "^https?://[^,]+(,https?://[^,]+)*$"
    Description: Origin được gọi API ngoài URL web ở trên (không lặp lại URL đó), phân cách bằng dấu phẩy.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Email nhận cảnh báo lỗi (phải bấm xác nhận thư từ SNS). Bỏ trống thì alarm không gửi đi đâu.
  SesSender:
    Type: String
    Description: Địa chỉ gửi đã xác minh trong SES.
  ClaimKeysParam:
    Type: String
    Default: /smart-parking/dev/claim-keys
    AllowedPattern: "^/.+"
    Description: Tên SSM SecureString chứa khóa HMAC ký QR (tạo bằng CLI trước khi deploy).

Conditions:
  UseCloudFrontUrl: !Equals [!Ref WebBaseUrl, ""]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: ../../backend/src
    Environment:
      Variables:
        SITE_ID: !Ref SiteId
        SLOTS_TABLE: !Ref SlotsTable
        SESSIONS_TABLE: !Ref SessionsTable
        ACTIVE_PLATES_TABLE: !Ref ActivePlatesTable
        PROCESSED_TABLE: !Ref ProcessedTable
        DEVICES_TABLE: !Ref DevicesTable
        PRICING_TABLE: !Ref PricingTable
        WEB_BASE_URL: !If [UseCloudFrontUrl, !Sub "https://${WebDistribution.DomainName}", !Ref WebBaseUrl]
        SES_SENDER: !Ref SesSender
        CLAIM_KEYS_PARAM: !Ref ClaimKeysParam

Resources:
  # ---------- DynamoDB (docs/api-contract.md §5) ----------
  SlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smart-parking-${Stage}-slots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: slot_id, AttributeType: S}]
      KeySchema: [{AttributeName: slot_id, KeyType: HASH}]

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smart-parking-${Stage}-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: session_id, AttributeType: S}
        - {AttributeName: site_id, AttributeType: S}
        - {AttributeName: state, AttributeType: S}
        - {AttributeName: created_at, AttributeType: S}
        - {AttributeName: claim_pk, AttributeType: S}
        - {AttributeName: claim_expires_at, AttributeType: S}
        - {AttributeName: pii_pk, AttributeType: S}
        - {AttributeName: purge_due_at, AttributeType: S}
      KeySchema: [{AttributeName: session_id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: by_state
          KeySchema:
            - {AttributeName: state, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        # Danh sách mọi phiên mới nhất trước cho trang quản trị.
        - IndexName: by_site
          KeySchema:
            - {AttributeName: site_id, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        # Chỉ phiên còn QR có claim_pk; không chiếu biển số/email sang index này.
        - IndexName: active_claims
          KeySchema:
            - {AttributeName: claim_pk, KeyType: HASH}
            - {AttributeName: claim_expires_at, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [state, session_ref, slot_id, claim_nonce, created_at]
        # Job purge (đợt sau) quét phiên còn dữ liệu định danh theo hạn.
        - IndexName: purge_due
          KeySchema:
            - {AttributeName: pii_pk, KeyType: HASH}
            - {AttributeName: purge_due_at, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}

  ActivePlatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smart-parking-${Stage}-active-plates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: plate_normalized, AttributeType: S}]
      KeySchema: [{AttributeName: plate_normalized, KeyType: HASH}]

  ProcessedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smart-parking-${Stage}-processed
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: message_id, AttributeType: S}]
      KeySchema: [{AttributeName: message_id, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  DevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smart-parking-${Stage}-devices
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: device_id, AttributeType: S}]
      KeySchema: [{AttributeName: device_id, KeyType: HASH}]

  PricingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub smart-parking-${Stage}-pricing
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pricing_id, AttributeType: S}]
      KeySchema: [{AttributeName: pricing_id, KeyType: HASH}]

  # ---------- Lambda nhận message thiết bị ----------
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-parking-${Stage}-ingest
      Handler: parking.ingest.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SlotsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref SessionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ActivePlatesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ProcessedTable}
        - DynamoDBCrudPolicy: {TableName: !Ref DevicesTable}
        - DynamoDBReadPolicy: {TableName: !Ref PricingTable}
        - Statement:
            - Effect: Allow
              Action: iot:Publish
              Resource:
                - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/gates/gate-01/commands
                - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/displays/gate-01/commands
            # Lấy endpoint dữ liệu riêng của tài khoản để publish; action này không giới hạn được theo resource.
            - Effect: Allow
              Action: iot:DescribeEndpoint
              Resource: "*"
      EventInvokeConfig:
        MaximumRetryAttempts: 2
      Events:
        DeviceMessages:
          Type: IoTRule
          Properties:
            AwsIotSqlVersion: "2016-03-23"
            # Mọi topic thiết bị của site, trừ lệnh do chính backend phát.
            Sql: !Sub "SELECT *, topic() AS mqtt_topic FROM 'parking/v1/${SiteId}/+/+/+' WHERE topic(6) <> 'commands'"

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${IngestFunction}
      RetentionInDays: 7

  # ---------- HTTP API ----------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-parking-${Stage}-api
      Handler: parking.api.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SessionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref SlotsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ActivePlatesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ProcessedTable}
        - DynamoDBCrudPolicy: {TableName: !Ref PricingTable}
        - DynamoDBReadPolicy: {TableName: !Ref DevicesTable}
        - Statement:
            # Cho xe vào sau khi sửa OCR kiểm snapshot ô còn mới bằng ConditionCheck trong transaction;
            # DynamoDBReadPolicy không có action này.
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt DevicesTable.Arn
            # Quản trị cho xe vào sau khi sửa OCR và mở cần ra.
            - Effect: Allow
              Action: iot:Publish
              Resource:
                - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/gates/gate-01/commands
                - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/displays/gate-01/commands
            - Effect: Allow
              Action: iot:DescribeEndpoint
              Resource: "*"
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ClaimKeysParam}
            # Trong SES sandbox, quyền được kiểm cả identity người nhận đã xác minh.
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Events:
        Layout:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /public/layout, Auth: {Authorizer: NONE}}
        Claim:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: "/public/claims/{token}", Auth: {Authorizer: NONE}}
        ClaimEmail:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/public/claims/{token}/email", Auth: {Authorizer: NONE}}
        ActiveClaims:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /kiosk/active-claims}
        Dashboard:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /admin/dashboard}
        Sessions:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /admin/sessions}
        Session:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: "/admin/sessions/{session_id}"}
        ResolvePlate:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/admin/sessions/{session_id}/resolve-plate"}
        RenewClaim:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/admin/sessions/{session_id}/renew-claim"}
        Payment:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/admin/sessions/{session_id}/payment"}
        OpenExit:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/admin/sessions/{session_id}/open-exit"}
        ConfirmPassage:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: "/admin/sessions/{session_id}/confirm-passage"}
        Devices:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /admin/devices}
        PricingGet:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /admin/pricing}
        PricingPut:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: PUT, Path: /admin/pricing}

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 7

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      # AllowOrigins viết bằng hàm thì SAM coi hàm đó là toàn bộ cấu hình CORS (bỏ AllowMethods/AllowHeaders)
      # và API không còn CORS. Vì vậy hàm bọc cả cấu hình, mỗi nhánh là một cấu hình đầy đủ.
      CorsConfiguration: !If
        - UseCloudFrontUrl
        - AllowOrigins: !Split [",", !Sub "https://${WebDistribution.DomainName},${CorsOrigins}"]
          AllowMethods: [GET, POST, PUT, OPTIONS]
          AllowHeaders: [Authorization, Content-Type, Idempotency-Key]
          MaxAge: 600
        - AllowOrigins: !Split [",", !Sub "${WebBaseUrl},${CorsOrigins}"]
          AllowMethods: [GET, POST, PUT, OPTIONS]
          AllowHeaders: [Authorization, Content-Type, Idempotency-Key]
          MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        "POST /public/claims/{token}/email":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1

  # ---------- Job theo lịch (EventBridge Scheduler) ----------
  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub smart-parking-${Stage}-jobs
      Handler: parking.jobs.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SessionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref SlotsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ActivePlatesTable}
      Events:
        ExpireReservations:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            Input: '{"job": "expire_reservations"}'
            RetryPolicy: {MaximumRetryAttempts: 0}
        PurgeIdentity:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)
            Input: '{"job": "purge_identity"}'
            RetryPolicy: {MaximumRetryAttempts: 2}

  JobsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${JobsFunction}
      RetentionInDays: 7

  # ---------- Cảnh báo lỗi ----------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub smart-parking-${Stage}-alarms
      Subscription:
        - {Protocol: email, Endpoint: !Ref AlarmEmail}

  # Job lỗi = purge có thể trễ hạn 10 ngày (docs/aws-deployment.md §6).
  JobsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-parking-${Stage}-jobs-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref JobsFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  # Ingest lỗi gồm cả trường hợp không phát được lệnh cổng/OLED.
  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-parking-${Stage}-ingest-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref IngestFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  # Lambda API tự bắt lỗi và trả 500/503, nên đo ở API Gateway thay vì Errors của Lambda.
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-parking-${Stage}-api-5xx
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - {Name: ApiId, Value: !Ref HttpApi}
        - {Name: Stage, Value: v1}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  # ---------- Web: S3 riêng tư + CloudFront ----------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub smart-parking-${Stage}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Route SPA (/s/{token}, /kiosk, /admin/...) không phải file trong S3: trả index.html.
  # Token QR có dấu chấm nên /s/* luôn được viết lại, không dựa vào đuôi file.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub smart-parking-${Stage}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Trả index.html cho route của web app
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (uri.indexOf('/s/') === 0 || last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub smart-parking-${Stage} web
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # Có edge châu Á cho người dùng ở Việt Nam.
        PriceClass: PriceClass_200
        Origins:
          - Id: web-s3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
        DefaultCacheBehavior:
          TargetOriginId: web-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          # Managed-SecurityHeadersPolicy: Referrer-Policy strict-origin-when-cross-origin để token QR
          # trong URL không lọt sang trang khác, kèm HSTS/nosniff/frame-options.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN

  # ---------- Cognito: tài khoản ADMIN/KIOSK do quản trị tạo ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub smart-parking-${Stage}
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub smart-parking-${Stage}-web
      GenerateSecret: false
      # web/src/auth.ts gọi InitiateAuth USER_PASSWORD_AUTH qua HTTPS (không cần thư viện SRP).
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {GroupName: ADMIN, UserPoolId: !Ref UserPool}

  KioskGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {GroupName: KIOSK, UserPoolId: !Ref UserPool}

  # ---------- IoT: mỗi thiết bị chỉ publish/subscribe topic của nó (docs/mqtt-contract.md §1) ----------
  PiThing:
    Type: AWS::IoT::Thing
    Properties: {ThingName: pi-01}

  GateThing:
    Type: AWS::IoT::Thing
    Properties: {ThingName: gate-01}

  SlotsThing:
    Type: AWS::IoT::Thing
    Properties: {ThingName: slots-01}

  PiPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub smart-parking-${Stage}-pi-01
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/pi-01
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/vision/pi-01/events
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/devices/pi-01/status

  SlotsPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub smart-parking-${Stage}-slots-01
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/slots-01
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/slots/slots-01/state
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/devices/slots-01/status

  GatePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub smart-parking-${Stage}-gate-01
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/gate-01
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/gates/gate-01/telemetry
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/displays/gate-01/telemetry
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/devices/gate-01/status
          - Effect: Allow
            Action: iot:Subscribe
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/parking/v1/${SiteId}/gates/gate-01/commands
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/parking/v1/${SiteId}/displays/gate-01/commands
          - Effect: Allow
            Action: iot:Receive
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/gates/gate-01/commands
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/v1/${SiteId}/displays/gate-01/commands

Outputs:
  ApiUrl:
    Description: Điền vào VITE_API_BASE_URL của web.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1
  WebUrl:
    Value: !If [UseCloudFrontUrl, !Sub "https://${WebDistribution.DomainName}", !Ref WebBaseUrl]
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  IotPolicies:
    Description: Gắn vào certificate từng thiết bị.
    Value: !Sub ${PiPolicy}, ${GatePolicy}, ${SlotsPolicy}
